<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact — Sotha</title>
  <meta name="description" content="Get in touch with Sotha for film projects and collaborations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-header container">
      <p class="eyebrow">Get in Touch</p>
      <h1>Contact</h1>
      <p class="hero-sub">Open to collaborations, crew work, and new projects.</p>
    </section>

    <section class="contact container">
      <form class="contact-form" id="contactForm" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
        <input type="hidden" name="form-name" value="contact">
        <p class="form-honeypot"><label>Don't fill this out if you're human: <input name="bot-field"></label></p>

        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <div class="contact-info">
        <h2>Direct</h2>
        <p><a href="mailto:ceogoogl171@gmail.com">ceogoogl171@gmail.com</a></p>
        <h2>Elsewhere</h2>
        <ul class="social-links">
          <li><a href="#">Instagram</a></li>
          <li><a href="#">Vimeo</a></li>
          <li><a href="#">LinkedIn</a></li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; <span id="year"></span> Sotha. All rights reserved.</p>
      <ul class="social-links">
        <li><a href="#">Instagram</a></li>
        <li><a href="#">Vimeo</a></li>
        <li><a href="#">LinkedIn</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
